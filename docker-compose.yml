services:

  mysql:
    image: mysql:8.0
    container_name: recipe-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - recipe_backend

  mysqlexporter:
    image: prom/mysqld-exporter:latest
    container_name: recipe-mysqlexporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - mysql
    volumes:
      - ./.my.cnf:/cfg/.my.cnf:ro
    command:
      - "--config.my-cnf=/cfg/.my.cnf"
    networks:
      - recipe_backend

  wordpress:
    image: wordpress:php8.2-apache
    container_name: recipe-wordpress
    restart: unless-stopped
    depends_on:
      - mysql
    env_file:
      - .env
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - recipe_backend
      - recipe_frontend

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: recipe-phpmyadmin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    networks:
      - recipe_backend
    ports:
      - "8080:80"

  nginx:
    image: nginx:alpine
    container_name: recipe-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - wordpress
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs:/var/log/nginx
    command: >
      sh -c "rm -f /var/log/nginx/access.log /var/log/nginx/error.log
      && nginx -g 'daemon off;'"
    networks:
      - recipe_frontend

  prometheus:
    image: prom/prometheus:latest
    container_name: recipe-prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    networks:
      - recipe_backend

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: recipe-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - recipe_backend

  grafana:
    image: grafana/grafana:latest
    container_name: recipe-grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - recipe_backend
  loki:
    image: grafana/loki:3.5.0
    container_name: recipe-loki
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - recipe_backend

  promtail:
    image: grafana/promtail:3.5.0
    container_name: recipe-promtail
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - loki
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ./logs:/var/log/nginx:ro
    networks:
      - recipe_backend
volumes:
  mysql_data:
  wordpress_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  recipe_frontend:
    driver: bridge

  recipe_backend:
    driver: bridge