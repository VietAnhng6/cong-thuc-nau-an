services:

  mysql:
    image: mysql:8.0
    container_name: recipe-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - recipe_backend

  wordpress:
    image: wordpress:php8.2-apache
    container_name: recipe-wordpress
    restart: unless-stopped
    depends_on:
      - mysql
    env_file:
      - .env
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - recipe_backend
      - recipe_frontend

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: recipe-phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    networks:
      - recipe_backend
    ports:
      - "8080:80"

  nginx:
    image: nginx:alpine
    container_name: recipe-nginx
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - recipe_frontend

volumes:
  mysql_data:
  wordpress_data:

networks:
  recipe_frontend:
    driver: bridge

  recipe_backend:
    driver: bridge